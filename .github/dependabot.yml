# Hält die per Commit-SHA gepinnten GitHub Actions aktuell. Dependabot schreibt
# SHA und Versionskommentar neu; der PR läuft durch die Pflicht-CI, Merge tippt Martin.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
